<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Callejeo</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Callejeo">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" href="icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  /* Mapa a pantalla completa + hoja inferior. Colores de ruta = marcas de sendero (GR rojo, PR amarillo, SL verde). */
  --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#EBEFE6; --ink:#14231D; --muted:#5C6B63; --line:#DBE2D7;
  --primary:#14231D; --on-primary:#FFFFFF; --mark:#F2B705; --danger:#C8102E;
  --shadow:0 10px 32px rgba(20,35,29,.16),0 2px 6px rgba(20,35,29,.08);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1613; --surface:#18211D; --surface-2:#222D28; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3832;
    --primary:#ECF1EC; --on-primary:#0F1613; --mark:#F2B705; --danger:#FF5A6E;
    --shadow:0 10px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#map{position:absolute;inset:0;background:var(--surface-2);z-index:0}
.leaflet-container{font-family:var(--body);background:var(--surface-2)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 75%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-top.leaflet-left{top:calc(var(--sat) + 4px)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:10px}
.pick{display:flex;flex-direction:column;gap:6px;min-width:150px}
.pick b{font-family:var(--display);font-size:13px;color:var(--muted);font-weight:500;padding:0 4px}
.pick button{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:15px}

@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}}
#scrim{position:absolute;top:0;left:0;right:0;height:calc(var(--sat)*1.5);background:linear-gradient(rgba(8,16,13,.55),rgba(8,16,13,0));z-index:440;pointer-events:none}
.mewrap{position:relative;width:22px;height:22px}
.mewrap .cone{position:absolute;left:50%;top:50%;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:40px solid rgba(30,107,255,.32);border-radius:50%;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--h,0deg));display:none}
.mewrap.has-h .cone{display:block}
.mewrap .me{position:relative}
.thumb{flex:none;width:60px;height:60px;border-radius:14px;object-fit:cover;border:3px solid var(--c);align-self:center;background:var(--surface-2)}
#navtop>div:nth-child(2){flex:1;min-width:0}
#nfix{flex:none;background:#fff;color:#14231D;font-weight:700;padding:11px 12px;border-radius:12px;font-size:14px}
.stat{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.stat b{font:700 18px var(--display)} .stat span{color:var(--muted);font-weight:500}
.mood{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .mood>span{margin-right:2px}
/* Marcadores */
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--primary);border:3px solid var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:var(--on-primary);font:700 12px var(--display)}
.pin.end{background:var(--danger)} .pin.end span{color:#fff}
.pin.via{background:var(--mark)} .pin.via span{color:#14231D}
.me{width:22px;height:22px;border-radius:50%;background:#1E6BFF;border:3px solid #fff;box-shadow:0 0 0 0 rgba(30,107,255,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(30,107,255,0)}100%{box-shadow:0 0 0 0 rgba(30,107,255,0)}}
@media (prefers-reduced-motion:reduce){.me{animation:none}*{transition:none!important}}

/* Hoja */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);
  max-height:80%;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
#sheet.collapsed{transform:translateY(calc(100% - 76px - var(--sab)))}
#grab{flex:none;width:100%;padding:8px 20px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;touch-action:none}
#grab>i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.head{width:100%;display:flex;align-items:center;gap:10px}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(#1F4A3A,#0D1F19);overflow:hidden}
.logo svg{display:block;width:100%;height:100%}
.head h1{font-size:22px;font-weight:700;flex:1}
.head .ghost{font-size:14px;font-weight:600;color:var(--ink);padding:8px 12px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
#body{overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}

.stops{background:var(--surface-2);border-radius:18px;padding:4px 4px 4px 0;display:flex;flex-direction:column}
.stop{display:flex;align-items:center;gap:0;min-height:52px}
.stop .dot{flex:none;width:44px;display:grid;place-items:center;position:relative;align-self:stretch}
.stop .dot::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px dotted var(--muted);opacity:.5}
.stop:first-child .dot::before{top:50%} .stop.last .dot::before{bottom:50%}
.stop .dot b{position:relative;width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:4px solid var(--primary)}
.stop.via .dot b{border-color:var(--mark)} .stop.end .dot b{border-color:var(--danger);border-radius:4px}
.stop .lbl{flex:1;min-width:0;padding:8px 6px 8px 0;border-bottom:1px solid var(--line)}
.stop.last .lbl{border-bottom:0}
.stop .lbl small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.stop .lbl span{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .lbl span.empty{color:var(--muted);font-weight:500}
.stop .mv{flex:none;width:34px;height:40px;display:grid;place-items:center;font-size:17px;font-weight:600;border-radius:10px}
.stop .x{flex:none;width:36px;height:40px;display:grid;place-items:center;color:var(--muted);font-size:20px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipbtn{padding:9px 13px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chipbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.sw{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--primary)} .sw[aria-checked="true"] i::after{transform:translateX(18px);background:var(--mark)}

.dur{display:flex;flex-direction:column;gap:6px}
.dur .top{display:flex;align-items:baseline;justify-content:space-between}
.dur label{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dur output{font:700 34px/1 var(--display)}
.dur .top{flex-wrap:wrap;gap:6px}
.dur output small{font:500 13px var(--body);color:var(--muted);margin-left:6px}
body.nav #toast{top:calc(var(--sat) + 150px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--primary) var(--p,30%),var(--line) var(--p,30%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--primary)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--mark);border:4px solid var(--primary);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--mark);border:4px solid var(--primary)}
.cta{width:100%;padding:16px;line-height:1.2;border-radius:16px;background:var(--primary);color:var(--on-primary);font:700 18px var(--display);text-align:center;display:flex;justify-content:center;align-items:center;gap:10px}
.cta:disabled{opacity:.4}
.cta.alt{background:var(--surface-2);color:var(--ink)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--muted);margin:0}
.note{font-size:14px;background:color-mix(in srgb,var(--mark) 22%,var(--surface));border-radius:12px;padding:10px 12px;margin:0}

.eb{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0}
.chipbtn.out{background:transparent;border:1.5px solid var(--line);padding:8px 12px}
.box{border:1.5px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.pace{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg.sm button{padding:6px 11px;font-size:13px}
.seg.full{display:flex} .seg.full button{flex:1;text-align:center;padding:8px 4px}
.kind{display:flex;flex-direction:column;gap:7px}
.mchip{padding:8px 13px 8px 10px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.mchip i{width:10px;height:10px;border-radius:50%;background:var(--mc)}
.mchip[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 15%,var(--surface))}
.card.mini{padding:11px 14px;align-items:center;border-width:1.5px;border-radius:14px}
.card.mini h3{font-size:15px;font-weight:600;font-family:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.card.mini .dotc{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.card.mini .r{flex:none;font-weight:600;font-size:14px;color:var(--muted)}
.tag.star{background:var(--mark);color:#14231D}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:16px;padding:12px;min-width:0}
.tile b{display:block;font:700 21px/1.15 var(--display);white-space:nowrap} .tile small{font-size:12px;color:var(--muted);font-weight:600}
.tile.hi{background:var(--primary);color:var(--on-primary)} .tile.hi small{color:inherit;opacity:.75}
.chart{border:1.5px solid var(--line);border-radius:18px;padding:12px 8px 4px}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow .d{flex:none;width:40px;text-align:center;font:700 19px/1 var(--display)} .hrow .d small{display:block;font:600 11px var(--body);color:var(--muted);text-transform:uppercase;margin-top:2px}
.hrow .m{flex:1;min-width:0} .hrow .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hrow .m small{color:var(--muted);font-size:13px}
.hrow .x{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);font-size:20px}
/* Tarjetas de ruta */
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:stretch;padding:12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);width:100%}
.card[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.way{flex:none;width:14px;border-radius:4px;background:linear-gradient(#fff 0 50%,var(--c) 50% 100%);border:1px solid var(--line)}
.card .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:17px;font-weight:700}
.card p{margin:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ok{color:#17804A;background:color-mix(in srgb,#17804A 14%,var(--surface))}
.card .big{flex:none;text-align:right;display:flex;flex-direction:column;justify-content:center}
.card .big b{font:700 22px/1.1 var(--display)} .card .big small{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.photos{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;flex:none}
.photos::-webkit-scrollbar{display:none}
.ph{flex:none;width:150px;display:flex;flex-direction:column;gap:6px;text-align:left}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:14px;background:var(--surface-2)}
.ph span{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.phh{font:600 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 -6px}
.pop b{font-family:var(--display);font-size:15px;display:block} .pop small{color:var(--muted)} .pop a{color:inherit;font-weight:600}
.pop img{width:180px;max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .cta{font-size:16px;padding:14px 8px}
.dock{position:sticky;bottom:-16px;margin:0 -16px -16px;padding:10px 16px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;z-index:2}
.dock small{text-align:center;color:var(--muted);font-size:12px}
.sub{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.saved{display:flex;flex-direction:column;gap:6px}
.saved h2{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-family:var(--body)}
.saved .it{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:2px 2px 2px 12px}
.saved .it button:first-child{flex:1;min-width:0;padding:9px 0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved .it small{color:var(--muted);font-weight:500;margin-left:6px}

/* Buscador */
#search{position:absolute;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 10px)}
.sbar{display:flex;gap:8px;align-items:center}
.sbar input{flex:1;min-width:0;font:500 17px var(--body);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.sbar input:focus{border-color:var(--primary);outline:0}
.sbar button{padding:12px 8px;font-weight:600}
#sres{overflow-y:auto;margin-top:10px;display:flex;flex-direction:column}
.res{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);width:100%}
.res .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:17px}
.res.act .ic{background:var(--primary);color:var(--on-primary)}
.res div{min-width:0} .res b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Avisos y botones flotantes */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 14px);transform:translateX(-50%);z-index:1000;background:var(--primary);color:var(--on-primary);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
#banner{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:600;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
#banner button{margin-left:auto;color:var(--muted);padding:6px 8px}
.fab{position:absolute;right:14px;z-index:450;width:48px;height:48px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
#locate{top:calc(var(--sat) + 14px)}
.fab svg{width:22px;height:22px}

/* Navegación */
#navtop{position:absolute;left:12px;right:12px;top:calc(var(--sat) + 10px);z-index:600;background:var(--primary);color:var(--on-primary);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center}
#navtop .arrow{flex:none;width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--on-primary) 14%,transparent);display:grid;place-items:center}
#navtop .arrow svg{width:32px;height:32px;transition:transform .3s}
#navtop .d{font:700 26px/1 var(--display)} #navtop .t{font-size:15px;opacity:.85;margin-top:3px}
#navtop.off{background:var(--danger);color:#fff}
#navbot{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:14px 16px calc(var(--sab) + 14px);display:flex;flex-direction:column;gap:12px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c,var(--primary));border-radius:4px;transition:width .5s}
.stats{display:flex;align-items:flex-end;gap:18px}
.stats div b{display:block;font:700 28px/1 var(--display)} .stats div small{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stats .sp{flex:1}
.navbtns{display:grid;grid-template-columns:auto auto 1fr 1fr;gap:8px}
.navbtns .sq{width:50px;height:50px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center}
.navbtns .sq[aria-pressed="true"]{background:var(--mark);color:#14231D}
.navbtns .sq svg{width:22px;height:22px}
.navbtns .cta{padding:12px 8px;font-size:15px;border-radius:14px}
.navbtns .stop-b{background:var(--danger);color:#fff}

@media (min-width:900px){
  #sheet{left:16px;right:auto;top:16px;bottom:16px;width:400px;max-height:none;border-radius:24px}
  #sheet.collapsed{transform:none}
  #grab>i{display:none} #grab{padding-top:16px;cursor:default}

}

<body>

  </button>

</section>

  <div class="arrow"><svg id="narrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 12l7-7 7 7"/></svg></div>

    <a class="cta alt" id="ngm" target="_blank" rel="noopener" style="text-decoration:none">Google Maps</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/pbf@3.2.1/dist/pbf.js"></script>
<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = 6371000, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;

function dest(p,brg,d){const b=rad(brg),la=rad(p[0]),lo=rad(p[1]),ad=d/R;const la2=Math.asin(Math.sin(la)*Math.cos(ad)+Math.cos(la)*Math.sin(ad)*Math.cos(b));const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(ad)*Math.cos(la),Math.cos(ad)-Math.sin(la)*Math.sin(la2));return [deg(la2),deg(lo2)];}
function bearing(a,b){const la=rad(a[0]),lb=rad(b[0]),dn=rad(b[1]-a[1]);return (deg(Math.atan2(Math.sin(dn)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dn)))+360)%360;}
const mid = (a,b) => [(a[0]+b[0])/2,(a[1]+b[1])/2];
const COMPASS = ['el norte','el noreste','el este','el sureste','el sur','el suroeste','el oeste','el noroeste'];
const compass = b => COMPASS[Math.round(((b%360)+360)%360/45)%8];
const fmtKm = m => m<950 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1).replace('.',',')+' km';
const fmtMin = m => {m=Math.max(1,Math.round(m));return m<60? m+' min' : Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');};
const store = {get(k,d){try{const v=localStorage.getItem('callejeo.'+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('callejeo.'+k,JSON.stringify(v));}catch(e){}}};
let toastT; function toast(msg,ms=3500){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}

/* ---------- estado ---------- */
const COLORS = ['#D7263D','#1E9E5A','#2B6FD6','#E07B00'];
const S = {mode:'plan',start:null,end:null,vias:[],loop:store.get('loop',true),minutes:store.get('minutes',45),unit:store.get('unit','min'),km:store.get('km',4),home:store.get('home',null),snap:[],parks:[],parksOk:false,style:store.get('style','variado'),parkMode:store.get('parkMode','cross'),pois:[],pace:store.get('pace',4.8),
  routes:[],sel:0,seed:0,busy:false,note:'',picking:null,me:null};
const targetD = () => S.unit==='km' ? S.km*1000 : S.minutes/60*S.pace*1000;
const STYLES={variado:['Variado',null,'Un poco de todo: lo más agradable que haya cerca.'],
  verde:['Verde',['park','garden','nature_reserve','beach'],'Parques, jardines y zonas naturales siempre que se pueda.'],
  urbano:['Urbano',['pedestrian','historic','attraction','wiki'],'Calles peatonales, plazas y sitios con historia.'],
  vistas:['Vistas',['viewpoint','beach','nature_reserve'],'Miradores, mar y sitios abiertos.']};
if(!STYLES[S.style]) S.style='variado';
const PACES = [[4,'Tranquilo'],[4.8,'Normal'],[5.6,'Ligero']];

/* ---------- mapa ---------- */
const dark = matchMedia('(prefers-color-scheme: dark)');
const view = store.get('view',{c:[41.372,2.117],z:14});
const map = L.map('map',{zoomControl:false,attributionControl:true}).setView(view.c,view.z);
map.attributionControl.setPrefix(false);
let tiles;
function setTiles(){ if(tiles) tiles.remove();
  tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://openfreemap.org">OpenFreeMap</a>'}).addTo(map); }
setTiles(); dark.addEventListener('change',setTiles);
map.on('moveend',()=>{const c=map.getCenter();store.set('view',{c:[c.lat,c.lng],z:map.getZoom()});});
const gMarkers = L.layerGroup().addTo(map), gRoutes = L.layerGroup().addTo(map), gDone = L.layerGroup().addTo(map), gMe = L.layerGroup().addTo(map);
const isWide = () => innerWidth>=900;
function pad(){ if(isWide()) return {paddingTopLeft:[440,40],paddingBottomRight:[40,40]};
  const sh=$('sheet'), h = S.mode==='nav'? $('navbot').offsetHeight : (sh.classList.contains('collapsed')?90:sh.offsetHeight);
  return {paddingTopLeft:[30,S.mode==='nav'?120:70],paddingBottomRight:[30,h+20]}; }

function pinIcon(cls,txt){return L.divIcon({className:'',html:`<div class="pin ${cls}"><span>${txt}</span></div>`,iconSize:[30,30],iconAnchor:[6,30]});}
function drawMarkers(){
  gMarkers.clearLayers();
  const add=(pl,cls,txt,target)=>{ if(!pl) return;
    const m=L.marker([pl.lat,pl.lng],{icon:pinIcon(cls,txt),draggable:S.mode==='plan',zIndexOffset:500}).addTo(gMarkers);
    m.on('dragend',()=>{const ll=m.getLatLng();setPlace(target,{lat:ll.lat,lng:ll.lng,label:null});}); };
  add(S.start,'',S.loop?'↻':'A','start');
  S.vias.forEach((v,i)=>add(v,'via',i+1,{via:i}));
  if(!S.loop) add(S.end,'end','B','end');
}
function drawRoutes(fit){
  gRoutes.clearLayers();
  S.routes.forEach((r,i)=>{ if(i===S.sel) return;
    L.polyline(r.coords,{color:r.color,weight:5,opacity:.45,lineCap:'round'}).addTo(gRoutes).on('click',e=>{L.DomEvent.stop(e);select(i);}); });
  const r=S.routes[S.sel]; if(!r) return;
  L.polyline(r.coords,{color:'#fff',weight:10,opacity:.95,lineCap:'round',lineJoin:'round',interactive:false}).addTo(gRoutes);
  L.polyline(r.coords,{color:r.color,weight:6,lineCap:'round',lineJoin:'round',interactive:false}).addTo(gRoutes);
  (r.hl||[]).forEach(h=>L.circleMarker(h.p,{radius:6,color:'#fff',weight:2,fillColor:r.color,fillOpacity:1}).addTo(gRoutes).on('click',e=>{L.DomEvent.stop(e);showHl(h);}));
  if(fit) map.fitBounds(L.latLngBounds(r.coords),pad());
}

/* ---------- geocodificación (Photon / OpenStreetMap) ---------- */
function photonLabel(p){const st=p.street?(p.street+(p.housenumber?' '+p.housenumber:'')):'';
  const main=p.name||st||p.city||'Punto en el mapa'; const sub=[p.name&&st?st:'',p.district&&p.district!==main?p.district:'',p.city&&p.city!==main?p.city:''].filter(Boolean).join(', ');
  return {main,sub};}
async function geocode(q){const c=map.getCenter();
  const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}`);
  if(!r.ok) throw new Error('geo'); const j=await r.json();
  return j.features.map(f=>{const l=photonLabel(f.properties);return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],label:l.main,sub:l.sub};});}
async function reverse(lat,lng){try{const r=await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lng}`);const j=await r.json();
  if(j.features&&j.features[0]) return photonLabel(j.features[0].properties).main;}catch(e){} return null;}

function locate(){return new Promise((ok,ko)=>{ if(!navigator.geolocation) return ko(new Error('nogeo'));
  navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),ko,{enableHighAccuracy:true,timeout:12000,maximumAge:15000});});}
const geoFail = () => toast('No he podido obtener tu ubicación. Revisa el permiso de ubicación del navegador.');

function setPlace(target,pl){
  if(target==='home'){S.home=pl;S.start=pl;S.loop=true;store.set('loop',true);store.set('home',pl);}
  else if(target==='start') S.start=pl; else if(target==='end') S.end=pl; else if(target==='newvia') {S.vias.push(pl);} else S.vias[target.via]=pl;
  if(S.mode!=='plan'){S.mode='plan';S.routes=[];drawRoutes();}
  drawMarkers(); render();
  if(S.start===pl) loadArea([pl.lat,pl.lng],1500,0).catch(()=>{});
  if(!pl.label){ pl.label='Punto en el mapa'; reverse(pl.lat,pl.lng).then(n=>{if(n){pl.label=n;if(S.home===pl)store.set('home',pl);render();}}); }
  else { const rec=store.get('recent',[]).filter(r=>r.label!==pl.label); rec.unshift({lat:pl.lat,lng:pl.lng,label:pl.label,sub:pl.sub||''}); store.set('recent',rec.slice(0,6)); }
}

/* ---------- sitios bonitos y fotos (OpenStreetMap + Wikipedia) ---------- */
const poiCache={};
function tfetch(url,ms=9000,opts){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{...(opts||{}),signal:c.signal}).finally(()=>clearTimeout(t));}
const KIND={park:['Parque',3,130],garden:['Jardín',2.5,90],nature_reserve:['Espacio natural',3,150],viewpoint:['Mirador',3,60],beach:['Playa',3,120],
  attraction:['Lugar de interés',2,60],pedestrian:['Calle peatonal',1.5,45],historic:['Sitio histórico',1.5,60],wiki:['',1.2,90]};
async function wiki(lang,c,R){
  const u=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${c[0].toFixed(5)}%7C${c[1].toFixed(5)}&ggsradius=${Math.round(Math.min(10000,Math.max(500,R)))}&ggslimit=50&prop=coordinates%7Cpageimages&piprop=thumbnail&pithumbsize=480&pilimit=50&colimit=50`;
  const r=await tfetch(u); if(!r.ok) throw new Error('wiki'); const j=await r.json(), pages=(j.query&&j.query.pages)||{};
  return Object.values(pages).filter(p=>p.thumbnail&&p.coordinates&&p.coordinates[0]&&!/\.svg/i.test(p.thumbnail.source)).map(p=>({p:[p.coordinates[0].lat,p.coordinates[0].lon],name:p.title,kind:'wiki',w:KIND.wiki[1],img:p.thumbnail.source,url:`https://${lang}.wikipedia.org/?curid=${p.pageid}`}));
}
/* ---------- datos del mapa: teselas vectoriales de OpenFreeMap (datos de OpenStreetMap). Rápidas y sin colas, a diferencia de Overpass ---------- */
const TZ=14, r5=v=>+v.toFixed(5);
function mvt(buf){ const val=(t,o,p)=>{ if(t===1)o.v=p.readString(); else if(t===2)o.v=p.readFloat(); else if(t===3)o.v=p.readDouble(); else if(t===4||t===5)o.v=p.readVarint(); else if(t===6)o.v=p.readSVarint(); else if(t===7)o.v=p.readBoolean(); };
  const feat=(t,f,p)=>{ if(t===2)p.readPackedVarint(f.tags); else if(t===3)f.type=p.readVarint(); else if(t===4)p.readPackedVarint(f.geom); };
  const layer=(t,l,p)=>{ if(t===1)l.name=p.readString(); else if(t===2)l.features.push(p.readMessage(feat,{tags:[],geom:[],type:0})); else if(t===3)l.keys.push(p.readString()); else if(t===4)l.values.push(p.readMessage(val,{v:null}).v); else if(t===5)l.extent=p.readVarint(); };
  const out={}; new Pbf(buf).readFields((t,o,p)=>{ if(t===3){const l=p.readMessage(layer,{name:'',features:[],keys:[],values:[],extent:4096}); o[l.name]=l;} },out); return out; }
const ll2t=(lat,lon)=>{const n=2**TZ;return [Math.floor((lon+180)/360*n),Math.floor((1-Math.asinh(Math.tan(rad(lat)))/Math.PI)/2*n)];};
function ringIn(ring,p){ let c=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j]; if((a[0]>p[0])!==(b[0]>p[0])&&p[1]<(b[1]-a[1])*(p[0]-a[0])/(b[0]-a[0])+a[1]) c=!c;} return c; }
function parseTile(buf,x,y){ const out={pk:[],po:[]}; if(!buf.byteLength) return out; const T=mvt(buf), n=2**TZ;
  const props=(l,f)=>{const o={};for(let i=0;i<f.tags.length;i+=2)o[l.keys[f.tags[i]]]=l.values[f.tags[i+1]];return o;};
  const ll=(l,px,py)=>{const X=(x+px/l.extent)/n,Y=(y+py/l.extent)/n;return [r5(deg(Math.atan(Math.sinh(Math.PI*(1-2*Y))))),r5(X*360-180)];};
  const P=T.poi; if(P) P.features.forEach(f=>{ if(f.type!==1||f.geom.length<3) return; const p=props(P,f), px=(f.geom[1]>>1)^-(f.geom[1]&1), py=(f.geom[2]>>1)^-(f.geom[2]&1);
    if(px<0||py<0||px>=P.extent||py>=P.extent) return;
    const kind=p.class==='park'?'park':p.class==='garden'?'garden':p.subclass==='viewpoint'?'viewpoint':(p.class==='attraction'||p.class==='museum')?'attraction':(p.class==='monument'||p.class==='castle')?'historic':null;
    const name=p.name||p['name:latin']||''; if(!kind||(!name&&kind!=='viewpoint')) return; out.po.push({p:ll(P,px,py),name:name||KIND[kind][0],kind,w:KIND[kind][1]}); });
  const L=T.landcover, gd=[]; if(L) L.features.forEach(f=>{ if(f.type!==3) return; const sc=props(L,f).subclass; if(sc!=='park'&&sc!=='garden') return;
    let cx=0,cy=0,i=0,ring=null; const g=f.geom, close=()=>{ if(!ring||ring.length<3) return; let a=1e9,b=-1e9,c=1e9,d=-1e9; ring.forEach(q=>{a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[1]);d=Math.max(d,q[1]);});
      if(Math.max(b-a,d-c)<70) return; const o=[]; ring.forEach((q,k)=>{const v=ll(L,q[0],q[1]); if(!k||hav(o[o.length-1],v)>6) o.push(v);}); if(o.length>2) (sc==='park'?out.pk:gd).push(o); };
    while(i<g.length){ const cmd=g[i]&7,cn=g[i]>>3; i++; if(cmd===7){close();ring=null;continue;}
      for(let k=0;k<cn;k++){ cx+=(g[i]>>1)^-(g[i]&1); cy+=(g[i+1]>>1)^-(g[i+1]&1); i+=2; if(cmd===1){close();ring=[];} ring.push([cx,cy]); } } close(); });
  const named=out.po.filter(q=>q.kind==='garden'||q.kind==='park'); gd.forEach(r=>{ if(named.some(q=>ringIn(r,q.p))) out.pk.push(r); });   // jardines: solo los públicos con nombre
  return out; }
const tmem={};
async function tileUrl(){ const s=store.get('tver',null); if(s&&Date.now()-s.t<864e5) return s.u;
  try{ const u=(await (await tfetch('https://tiles.openfreemap.org/planet',8000)).json()).tiles[0]; store.set('tver',{t:Date.now(),u}); return u; }catch(e){ if(s) return s.u; throw e; } }
async function getTile(x,y){ const k=x+'/'+y; if(tmem[k]) return tmem[k]; const all=store.get('tiles',{}); if(all[k]&&Date.now()-all[k].t<120*864e5) return tmem[k]=all[k];
  const r=await tfetch((await tileUrl()).replace('{z}',TZ).replace('{x}',x).replace('{y}',y),25000); if(!r.ok&&r.status!==404) throw new Error('tile '+r.status);
  const d=parseTile(r.ok?await r.arrayBuffer():new ArrayBuffer(0),x,y); d.t=Date.now(); return tmem[k]=d; }
function saveTiles(){ const all=Object.assign(store.get('tiles',{}),tmem), ks=Object.keys(all).sort((a,b)=>all[b].t-all[a].t);
  for(let n=Math.min(ks.length,36);n>0;n=Math.floor(n*0.6)){ try{ const o={}; ks.slice(0,n).forEach(k=>o[k]=all[k]); localStorage.setItem('callejeo.tiles',JSON.stringify(o)); return; }catch(e){} } }
function buildArea(tiles){ const rings=[].concat(...tiles.map(t=>t.pk)), pois=[], par=rings.map((_,i)=>i), find=i=>par[i]===i?i:(par[i]=find(par[i]));
  tiles.forEach(t=>t.po.forEach(p=>{ if(!pois.some(q=>q.name===p.name&&q.kind===p.kind&&hav(q.p,p.p)<150)) pois.push({...p}); }));
  const bb=rings.map(r=>{let a=90,b=-90,c=180,d=-180;r.forEach(q=>{a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[1]);d=Math.max(d,q[1]);});return [a,b,c,d];});
  for(let i=0;i<rings.length;i++) for(let j=i+1;j<rings.length;j++){ const A=bb[i],B=bb[j]; if(A[0]>B[1]||B[0]>A[1]||A[2]>B[3]||B[2]>A[3]||find(i)===find(j)) continue;
    if(rings[i].some(q=>ringIn(rings[j],q))||rings[j].some(q=>ringIn(rings[i],q))) par[find(i)]=find(j); }
  const groups={}; rings.forEach((r,i)=>{(groups[find(i)]=groups[find(i)]||[]).push(r);});
  const parks=Object.values(groups).map(rs=>{ const nm=pois.find(q=>(q.kind==='park'||q.kind==='garden')&&rs.some(r=>ringIn(r,q.p))); return {name:nm?nm.name:'',rings:rs}; });
  return {pois,parks}; }
function mergePois(base,wikis){ const all=base.map(p=>({...p})); wikis.forEach(list=>list.forEach(p=>{ const dup=all.find(q=>hav(q.p,p.p)<70);
    if(dup){ if(!dup.img){dup.img=p.img;dup.url=p.url;dup.w+=0.5;} } else all.push({...p}); })); return all; }
const wmem={};
async function loadArea(c,reach,waitMs){ const R=Math.min(Math.max(reach,700),2600), dl=R/110540, dn=R/(111320*Math.cos(rad(c[0])));

      for(let i=0;i<found.length;i++) found[i]=await redo(found[i]); if(direct) direct=await redo(direct); }
    else found.concat(direct?[direct]:[]).forEach(r=>{ r.cross=parkCuts(r,S.parks).names; });
    if(direct){direct.keys=segKeys(direct.coords);direct.hl=highlights(direct); if(!found.some(r=>similar(r.keys,direct.keys)>0.9)) found.push(direct);}
    if(!found.length) throw new Error('none');
    const seen={}; found.forEach((r,i)=>{r.color=COLORS[i%COLORS.length];seen[r.title]=(seen[r.title]||0)+1; if(seen[r.title]>1) r.title=r.title.replace('Rodeo','Rodeo amplio').replace('Vuelta','Otra vuelta'); r.min=r.dist/1000/S.pace*60;
      const top=r.hl.filter(h=>h.w>=2.5).sort((a,b)=>b.w-a.w)[0]; if(top&&!r.direct){const t=(S.loop&&!S.vias.length?'Vuelta por ':'Pasando por ')+top.name; if(!found.some(o=>o.title===t)) r.title=t;} });
    S.routes=found; S.sel=0; S.mode='results'; S.seed++;
    $('sheet').classList.remove('collapsed'); S.busy=false; drawMarkers(); render(); drawRoutes(true);
    Promise.all(found.map(climb)).then(()=>{ if(S.mode==='results') render(); });
  }catch(e){ S.busy=false; render(); toast(navigator.onLine?'No he encontrado rutas a pie entre esos puntos. Prueba a moverlos un poco.':'Sin conexión: hace falta internet para calcular rutas.',5000); }
}
function showHl(h){ L.popup({offset:[0,-4]}).setLatLng(h.p).setContent(`<div class="pop">${h.img?`<img src="${esc(h.img)}" alt="">`:''}<b>${esc(h.name)}</b><small>${KIND[h.kind][0]||'Lugar con artículo'}${h.url?` · <a href="${esc(h.url)}" target="_blank" rel="noopener">Wikipedia</a>`:''}</small></div>`).openOn(map); }
function select(i){S.sel=i;render();drawRoutes(true);}

function gmapsUrl(r){
  const n=Math.min(8,Math.max(3,Math.round(r.dist/600))), pts=[];
  for(let k=1;k<=n;k++){const t=r.dist*k/(n+1);let i=r.cum.findIndex(c=>c>=t);if(i<0)i=r.coords.length-1;pts.push({at:t,p:r.coords[i]});}
  r.viaAt.forEach(v=>{const near=pts.findIndex(q=>Math.abs(q.at-v.at)<r.dist/(n+1)/2); if(near>=0) pts[near]=v; else pts.push(v);});
  pts.sort((a,b)=>a.at-b.at);
  const f=p=>p[0].toFixed(5)+','+p[1].toFixed(5), a=r.coords[0], b=r.coords[r.coords.length-1];
  return 'https://www.google.com/maps/dir/?api=1&travelmode=walking&origin='+f(a)+'&destination='+f(b)+'&waypoints='+encodeURIComponent(pts.slice(0,9).map(q=>f(q.p)).join('|'));
}

}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function statsHtml(){
  const h=store.get('hist',[]), saved=store.get('saved',[]), now=new Date(), w0=weekStart(now).getTime(), W=7*864e5;
  const weeks=Array.from({length:8},(_,i)=>({t:w0-(7-i)*W,m:0})); let month=0,total=0;
  h.forEach(x=>{ total+=x.dist; const d=new Date(x.t); if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()) month+=x.dist;
    const i=7+Math.round((weekStart(d).getTime()-w0)/W); if(i>=0&&i<8) weeks[i].m+=x.dist; });
  const max=Math.max(4000,...weeks.map(w=>w.m)), sw=340/8;
  const bars=weeks.map((w,i)=>{const hh=w.m?Math.max(6,w.m/max*96):3,x=i*sw+7,cur=i===7;
    return `<rect x="${x}" y="${118-hh}" width="${sw-14}" height="${hh}" rx="6" fill="${cur?'var(--mark)':'var(--ink)'}" opacity="${cur?1:w.m?.28:.1}"/>`+
      (w.m?`<text x="${x+(sw-14)/2}" y="${112-hh}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${(w.m/1000).toFixed(1).replace('.',',')}</text>`:'')+
      `<text x="${x+(sw-14)/2}" y="136" text-anchor="middle" font-size="9.5" font-weight="${cur?700:500}" fill="var(--muted)">${cur?'Esta':new Date(w.t+432e5).toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.','')}</text>`;}).join('');
  return `
    <div class="tiles"><div class="tile hi"><b class="num">${fmtKm(weeks[7].m)}</b><small>Esta semana</small></div>
      <div class="tile"><b class="num">${fmtKm(month)}</b><small>Este mes</small></div>
      <div class="tile"><b class="num">${h.length}</b><small>${h.length===1?'Paseo':'Paseos'} en total</small></div></div>
    <h2 class="eb">Kilómetros por semana</h2>

    ${saved.length?`<h2 class="eb">Rutas guardadas</h2><div class="saved">${saved.map((s,i)=>`<div class="it"><button data-load="${i}">${esc(s.name)}<small class="num">${fmtMin(s.min)} · ${fmtKm(s.dist)}</small></button><button class="x" data-del="${i}" aria-label="Borrar ruta guardada">×</button></div>`).join('')}</div>`:''}
    <h2 class="eb">Historial</h2>
    ${h.length?`<div>${h.slice(0,40).map((x,i)=>{const d=new Date(x.t);return `<div class="hrow"><span class="d num">${d.getDate()}<small>${d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')}</small></span>
      <span class="m"><b>${esc(x.title||'Paseo')}</b><small class="num">${fmtKm(x.dist)} · ${fmtMin(x.min)} · ${d.toLocaleDateString('es-ES',{weekday:'long'})}</small></span><button class="x" data-hdel="${i}" aria-label="Borrar del historial">×</button></div>`;}).join('')}</div>`
      :'<p class="hint">Aún no hay paseos. Cuando sigas una ruta con «Empezar paseo», se apunta aquí sola al terminar.</p>'}`;
}
function movePoint(i,dir){ const L=[S.start,...S.vias]; if(!S.loop) L.push(S.end); const j=i+dir; if(j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]];
  S.start=L[0]; if(S.loop) S.vias=L.slice(1).filter(Boolean); else {S.end=L[L.length-1];S.vias=L.slice(1,-1).filter(Boolean);}

  } else {

$('body').addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.search) return openSearch(JSON.parse(t.dataset.search));
  if(t.dataset.mv){const [i,d]=t.dataset.mv.split(',').map(Number);return movePoint(i,d);}
  if(t.dataset.rm!=null){S.vias.splice(+t.dataset.rm,1);drawMarkers();return render();}
  if(t.dataset.pace){S.pace=+t.dataset.pace;store.set('pace',S.pace);return render();}
  if(t.dataset.sel!=null) return select(+t.dataset.sel);
  if(t.dataset.style){S.style=t.dataset.style;store.set('style',S.style);return render();}
  if(t.dataset.park){S.parkMode=t.dataset.park;store.set('parkMode',S.parkMode);return render();}
  if(t.dataset.unit){S.unit=t.dataset.unit;store.set('unit',S.unit);return render();}
  if(t.dataset.hl!=null){const h=S.routes[S.sel].hl[+t.dataset.hl];if(!isWide())$('sheet').classList.add('collapsed');map.setView(h.p,Math.max(map.getZoom(),16));return showHl(h);}
  if(t.dataset.hdel!=null){const h=store.get('hist',[]);h.splice(+t.dataset.hdel,1);store.set('hist',h);return render();}
  if(t.dataset.del!=null){const s=store.get('saved',[]);s.splice(+t.dataset.del,1);store.set('saved',s);return render();}
  if(t.dataset.load!=null){const s=store.get('saved',[])[+t.dataset.load];
    const cum=[0];for(let i=1;i<s.coords.length;i++)cum.push(cum[i-1]+hav(s.coords[i-1],s.coords[i]));
    S.routes=[{...s,cum,color:COLORS[0],title:s.name,saved:true}];S.sel=0;S.mode='results';S.note='';S.start=s.start;S.end=s.end;S.vias=s.vias;S.loop=s.loop;drawMarkers();render();return drawRoutes(true);}
  switch(t.id){
    case 'addvia': return openSearch('newvia');
    case 'home': if(!S.home) return openSearch('home'); S.start=S.home; S.loop=true; store.set('loop',true); drawMarkers(); map.setView([S.home.lat,S.home.lng],Math.max(map.getZoom(),15)); return render();
    case 'loop': S.loop=!S.loop;store.set('loop',S.loop);
      if(!S.loop&&!S.end&&S.vias.length) S.end=S.vias.pop();           // sin circular: el último punto pasa a ser el final
      else if(S.loop&&S.end){S.vias.push(S.end);S.end=null;}             // circular: el final pasa a ser una parada más
      drawMarkers();return render();
    case 'go': case 'more': return plan();
    case 'follow': return startNav();
    case 'rev': return reverseRoute();
    case 'useme': return $('locate').click();
    case 'save': { const r=S.routes[S.sel], s=store.get('saved',[]);
      s.unshift({name:r.title+(r.streets[0]?' · '+r.streets[0]:''),dist:r.dist,min:r.min,coords:r.coords.map(c=>[+c[0].toFixed(5),+c[1].toFixed(5)]),steps:r.steps,streets:r.streets,viaAt:r.viaAt,hl:r.hl||[],start:S.start,end:S.end,vias:S.vias,loop:S.loop});
      store.set('saved',s.slice(0,12)); t.textContent='★ Guardado'; return; }
  }
});

  if(t.dataset.a==='sethome') return openSearch('home');
  if(t.dataset.a==='map'){closeSearch();S.picking=sTarget;$('sheet').classList.add('collapsed');$('bannertxt').textContent='Toca el mapa para fijar el punto';$('banner').hidden=false;return;}
  const p=$('sres')._list[+t.dataset.i];closeSearch();setPlace(sTarget,{lat:p.lat,lng:p.lng,label:p.label,sub:p.sub});
  const pts=[S.start,S.loop?null:S.end,...S.vias].filter(Boolean).map(x=>[x.lat,x.lng]);
  if(pts.length>1) map.fitBounds(L.latLngBounds(pts),{...pad(),maxZoom:16}); else map.setView([p.lat,p.lng],16);});
$('bannerx').addEventListener('click',()=>{S.picking=null;$('banner').hidden=true;$('sheet').classList.remove('collapsed');});
map.on('click',e=>{ if(S.mode==='nav') return; const ll={lat:e.latlng.lat,lng:e.latlng.lng,label:null};
  if(S.picking){const t=S.picking;S.picking=null;$('banner').hidden=true;$('sheet').classList.remove('collapsed');return setPlace(t,ll);}
  if(S.mode!=='plan') return;
  const d=document.createElement('div');d.className='pick';
  d.innerHTML='<b>Usar este punto como</b><button data-t="start">Inicio</button><button data-t="newvia">Parada intermedia</button>'+(S.loop?'':'<button data-t="end">Final</button>');
  const pop=L.popup({closeButton:false,offset:[0,-4]}).setLatLng(e.latlng).setContent(d).openOn(map);
  d.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;map.closePopup(pop);setPlace(b.dataset.t,ll);}); });

/* mi posición */
let meMarker=null,meAcc=null;
function showMe(p,acc){ if(!meMarker){meMarker=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="mewrap"><i class="cone"></i><div class="me"></div></div>',iconSize:[22,22],iconAnchor:[11,11]}),interactive:false,zIndexOffset:1000}).addTo(gMe);
    meAcc=L.circle(p,{radius:acc||20,color:'#1E6BFF',weight:0,fillOpacity:.12,interactive:false}).addTo(gMe);}
  meMarker.setLatLng(p); meAcc.setLatLng(p).setRadius(Math.min(acc||20,200)); }
$('locate').addEventListener('click',async()=>{try{const p=await locate();showMe([p.lat,p.lng]);map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));
  if(!S.start&&S.mode==='plan') setPlace('start',{...p,label:null});}catch(e){geoFail();}});

function onHeading(e){ let h=e.webkitCompassHeading; if(h==null&&e.absolute&&e.alpha!=null) h=360-e.alpha; if(h==null) return;
  const el=document.querySelector('.mewrap'); if(el){el.classList.add('has-h');el.style.setProperty('--h',h.toFixed(0)+'deg');} }
function askHeading(){ try{ const D=window.DeviceOrientationEvent; if(!D) return;
  const on=()=>{addEventListener('deviceorientation',onHeading,true);addEventListener('deviceorientationabsolute',onHeading,true);};
  if(typeof D.requestPermission==='function') D.requestPermission().then(r=>{if(r==='granted')on();}).catch(()=>{}); else on(); }catch(e){} }
/* ---------- seguir la ruta ---------- */
const N={watch:null,route:null,xy:null,idx:0,along:0,off:0,follow:true,voice:store.get('voice',false),said:-1,t0:0,lock:null,done:false};
function toXY(p,lat0){return [p[1]*Math.cos(rad(lat0))*111320,p[0]*110540];}
function snap(p,from,to){const r=N.route,q=toXY(p,r.coords[0][0]);let best={d:Infinity,i:0,along:0};
  for(let i=Math.max(0,from);i<Math.min(N.xy.length-1,to);i++){const a=N.xy[i],b=N.xy[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;
    const t=l2?Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/l2)):0,ex=a[0]+t*dx-q[0],ey=a[1]+t*dy-q[1],d=Math.hypot(ex,ey);
    if(d<best.d) best={d,i,along:r.cum[i]+t*(r.cum[i+1]-r.cum[i])};}
  return best;}
async function wake(){try{if('wakeLock' in navigator&&S.mode==='nav') N.lock=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') wake();});
function say(t){ if(!N.voice||!('speechSynthesis' in window)) return; try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }
function startNav(){
  const r=S.routes[S.sel]; if(!r) return; askHeading();
  if(!navigator.geolocation){toast('Este navegador no da acceso al GPS. Usa el botón de Google Maps.');return;}
  Object.assign(N,{route:r,xy:r.coords.map(c=>toXY(c,r.coords[0][0])),idx:0,along:0,off:0,follow:true,said:-1,t0:Date.now(),done:false,started:false,fix:false,walked:0,last:null,rej:false,rec:false});
  gDone.clearLayers(); N.doneLine=L.polyline([],{color:'#8C9891',weight:6,opacity:.95,lineCap:'round',interactive:false}).addTo(gDone); $('nfix').hidden=true; $('nstop').textContent='Terminar';
  clearTimeout(N.gt); N.gt=setTimeout(()=>{ if(S.mode==='nav'&&!N.fix) $('nt').textContent='Aún no llega señal GPS. Comprueba que la ubicación está permitida para esta app y sal a cielo abierto.'; },12000);
  S.routes=[r]; S.sel=0; S.mode='nav'; render(); drawMarkers(); drawRoutes(false);
  $('ngm').href=gmapsUrl(r); $('nprog').style.setProperty('--c',r.color); $('nprog').parentNode.style.setProperty('--c',r.color);
  $('nvoice').setAttribute('aria-pressed',N.voice); $('nrec').setAttribute('aria-pressed','true'); $('navtop').classList.remove('off');
  $('nd').textContent='—'; $('nt').textContent='Buscando tu posición…'; paintNav();
  map.setView(r.coords[0],17); wake();
  N.watch=navigator.geolocation.watchPosition(onPos,err=>{ if(err.code===1){$('nt').textContent='Ubicación denegada. Actívala en Ajustes > Privacidad > Localización > Sitios web de Safari, o usa Google Maps.';toast('Sin permiso de ubicación no puedo guiarte.',6000);} },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function recordWalk(dist){ if(N.rec||dist<200) return; N.rec=true; const h=store.get('hist',[]); h.unshift({t:Date.now(),dist:Math.round(dist),min:Math.max(1,Math.round((Date.now()-N.t0)/60000)),title:N.route.title}); store.set('hist',h.slice(0,300)); }
function stopNav(){ if(N.started&&!N.done) recordWalk(N.walked+N.along); if(N.watch!=null) navigator.geolocation.clearWatch(N.watch); N.watch=null; if(N.lock){N.lock.release().catch(()=>{});N.lock=null;}
  try{speechSynthesis.cancel();}catch(e){} gDone.clearLayers(); S.mode='results'; render(); drawMarkers(); drawRoutes(true); }
function paintNav(){ const r=N.route, left=Math.max(0,r.dist-N.along), min=left/1000/S.pace*60;
  $('nprog').style.width=Math.min(100,N.along/r.dist*100)+'%'; $('nleft').textContent=fmtMin(min); $('nkm').textContent=fmtKm(left);
  $('neta').textContent=new Date(Date.now()+min*60000).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function onPos(pos){
  if(S.mode!=='nav'||N.done) return; const p=[pos.coords.latitude,pos.coords.longitude], r=N.route;
  N.fix=true; N.last=p; showMe(p,pos.coords.accuracy); if(N.follow) map.setView(p,Math.min(19,Math.max(map.getZoom(),17)),{animate:true});
  let s=snap(p,N.idx-8,N.idx+120); if(s.d>60){const g=snap(p,0,N.xy.length); if(g.d<s.d-25) s=g;}
  const tol=Math.max(45,Math.min(90,(pos.coords.accuracy||0)*1.5));
  if(s.d>tol&&!N.started){ $('nd').textContent=fmtKm(s.d); $('nt').textContent='Camina hasta la línea marcada para empezar el paseo'; $('narrow').style.transform='rotate(0deg)'; return; }
  N.started=true;
  if(s.d>tol){ N.off++; if(N.off>=3){ $('navtop').classList.add('off'); $('nd').textContent=fmtKm(s.d); $('nt').textContent='Te has salido de la ruta. Vuelve a la línea marcada.';
      $('narrow').style.transform='rotate(180deg)'; $('nfix').hidden=false; if(N.off===3) say('Te has salido de la ruta'); } return; }
  N.off=0; $('navtop').classList.remove('off'); $('nfix').hidden=true; N.idx=s.i; N.along=s.along; paintNav();
  { const a=r.coords[s.i],b=r.coords[s.i+1]||a,sp=(r.cum[s.i+1]-r.cum[s.i])||1,t=Math.max(0,Math.min(1,(s.along-r.cum[s.i])/sp));
    N.doneLine.setLatLngs(r.coords.slice(0,s.i+1).concat([[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]])); }
  if(r.dist-N.along<22&&N.along>r.dist*0.7) return finish();
  const ni=r.steps.findIndex(st=>st.at>N.along+4), st=ni>=0?r.steps[ni]:r.steps[r.steps.length-1], d=Math.max(0,st.at-N.along);
  $('nd').textContent=d<12?'Ahora':'En '+fmtKm(d); $('nt').textContent=st.text; $('narrow').style.transform='rotate('+(st.ang||0)+'deg)';
  if(d<35&&N.said!==ni){N.said=ni;say(st.text);}
}
async function rejoin(){ if(!N.last||N.rej||S.mode!=='nav') return; N.rej=true; $('nt').textContent='Calculando cómo volver a la ruta…';
  try{ const r=N.route; let s=snap(N.last,N.idx,N.xy.length); if(!isFinite(s.d)) s=snap(N.last,0,N.xy.length);
    const i=Math.min(r.coords.length-1,s.i+1), cut=r.cum[i];
    const c=await route([{p:N.last,kind:'start'},{p:r.coords[i],kind:'end'}],!!r.around);
    const coords=c.coords.concat(r.coords.slice(i+1)), cum=[0]; for(let k=1;k<coords.length;k++) cum.push(cum[k-1]+hav(coords[k-1],coords[k]));
    const sh=x=>({...x,at:x.at-cut+c.dist});
    const m={...r,coords,cum,dist:cum[cum.length-1],steps:c.steps.filter(x=>!x.end).concat(r.steps.filter(x=>x.at>cut).map(sh)),viaAt:r.viaAt.filter(x=>x.at>cut).map(sh),hl:(r.hl||[]).filter(x=>x.at>cut).map(sh)};
    if(!m.steps.length||!m.steps[m.steps.length-1].end) m.steps.push({at:m.dist,text:'Has llegado',ang:0,end:true});
    N.walked+=N.along; Object.assign(N,{route:m,xy:coords.map(q=>toXY(q,coords[0][0])),idx:0,along:0,off:0,said:-1,started:true});
    S.routes=[m]; drawRoutes(false); N.doneLine.setLatLngs([]); $('navtop').classList.remove('off'); $('nfix').hidden=true; $('ngm').href=gmapsUrl(m); paintNav(); $('nd').textContent='Listo'; $('nt').textContent='Sigue la línea para volver a la ruta';
  }catch(e){ toast('No he podido recalcular. Vuelve a la línea marcada.'); } N.rej=false; }
$('nfix').addEventListener('click',rejoin);
function finish(){ N.done=true; const mins=(Date.now()-N.t0)/60000;
  { recordWalk(N.walked+N.route.dist); $('nstop').textContent='Cerrar'; } $('nprog').style.width='100%';
  $('nd').textContent='¡Paseo completado!'; $('nt').textContent=fmtKm(N.walked+N.route.dist)+' en '+fmtMin(mins); $('narrow').style.transform='rotate(0deg)'; say('Paseo completado');
  $('nleft').textContent='0 min'; $('nkm').textContent='0 m'; }
$('nstop').addEventListener('click',stopNav);
$('nrec').addEventListener('click',()=>{N.follow=true;$('nrec').setAttribute('aria-pressed','true');if(meMarker)map.setView(meMarker.getLatLng(),17);});
$('nvoice').addEventListener('click',()=>{N.voice=!N.voice;store.set('voice',N.voice);$('nvoice').setAttribute('aria-pressed',N.voice);if(N.voice)say('Indicaciones por voz activadas');else try{speechSynthesis.cancel();}catch(e){}});
map.on('dragstart',()=>{ if(S.mode==='nav'){N.follow=false;$('nrec').setAttribute('aria-pressed','false');} });

/* ---------- arranque ---------- */
(()=>{ const st=navigator.standalone||matchMedia('(display-mode: standalone)').matches; if(!st||!/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
  const d=document.createElement('div'); d.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden'; document.body.appendChild(d);
  if(d.offsetHeight<20) document.documentElement.style.setProperty('--sat','56px'); d.remove(); })();
render();
if(S.home) loadArea([S.home.lat,S.home.lng],1500,0).catch(()=>{});
if(navigator.permissions&&navigator.permissions.query){ navigator.permissions.query({name:'geolocation'}).then(st=>{ if(st.state==='granted') locate().then(p=>{showMe([p.lat,p.lng]);
  if(!S.start){map.setView([p.lat,p.lng],15);setPlace('start',{...p,label:null});}}).catch(()=>{}); }).catch(()=>{}); }
</script>
